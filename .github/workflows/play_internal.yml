name: Play Internal Test Upload

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Play Console package name. Falls back to repository variable PLAY_APPLICATION_ID."
        required: false
        type: string
      version_code:
        description: "Optional numeric Android versionCode. Defaults to 25000 + this workflow run number."
        required: false
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLAY_PACKAGE_NAME: ${{ inputs.package_name || vars.PLAY_APPLICATION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache Gradle and wrapper
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare Play build inputs
        shell: bash
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ -z "$PLAY_PACKAGE_NAME" ]]; then
            echo "Set the package_name workflow input or the PLAY_APPLICATION_ID repository variable." >&2
            exit 1
          fi

          if ! [[ "$PLAY_PACKAGE_NAME" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "Package name must be a valid Android application ID." >&2
            exit 1
          fi

          if [[ -n "$INPUT_VERSION_CODE" ]]; then
            PLAY_VERSION_CODE="$INPUT_VERSION_CODE"
          else
            PLAY_VERSION_CODE=$((25000 + GITHUB_RUN_NUMBER))
          fi

          if ! [[ "$PLAY_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "version_code must be numeric." >&2
            exit 1
          fi

          echo "PLAY_VERSION_CODE=$PLAY_VERSION_CODE" >> "$GITHUB_ENV"
          echo "PLAY_RELEASE_NAME=Internal $PLAY_VERSION_CODE (${GITHUB_SHA::7})" >> "$GITHUB_ENV"
          echo "PLAY_BUNDLE_PATH=app/build/outputs/bundle/tempusRelease/app-tempus-release.aab" >> "$GITHUB_ENV"

      - name: Decode Play keystore
        shell: bash
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/play-upload.jks"
          printf '%s' "$PLAY_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "PLAY_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build Tempus release bundle
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          ./gradlew bundleTempusRelease \
            -PplayApplicationId="$PLAY_PACKAGE_NAME" \
            -PversionCodeOverride="$PLAY_VERSION_CODE"

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFiles: ${{ env.PLAY_BUNDLE_PATH }}
          tracks: internal
          status: completed
          releaseName: ${{ env.PLAY_RELEASE_NAME }}

      - name: Upload signed bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: play-internal-aab
          path: ${{ env.PLAY_BUNDLE_PATH }}
          retention-days: 14
