name: Play Internal Test Upload

on:
  workflow_dispatch:
    inputs:
      package_name:
        description: "Play Console package name. Falls back to repository variable PLAY_APPLICATION_ID."
        required: false
        type: string
      version_code:
        description: "Optional numeric Android versionCode. Defaults to 25000 + this workflow run number."
        required: false
        type: string

jobs:
  upload:
    runs-on: ubuntu-latest
    env:
      PLAY_PACKAGE_NAME: ${{ inputs.package_name || vars.PLAY_APPLICATION_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Cache Gradle and wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Prepare Play build inputs
        shell: bash
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          if [[ -z "$PLAY_PACKAGE_NAME" ]]; then
            echo "Set the package_name workflow input or the PLAY_APPLICATION_ID repository variable." >&2
            exit 1
          fi

          if ! [[ "$PLAY_PACKAGE_NAME" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "Package name must be a valid Android application ID." >&2
            exit 1
          fi

          if [[ -n "$INPUT_VERSION_CODE" ]]; then
            PLAY_VERSION_CODE="$INPUT_VERSION_CODE"
          else
            PLAY_VERSION_CODE=$((25000 + GITHUB_RUN_NUMBER))
          fi

          if ! [[ "$PLAY_VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "version_code must be numeric." >&2
            exit 1
          fi

          BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ | tail -n 1)
          echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> "$GITHUB_ENV"
          echo "PLAY_VERSION_CODE=$PLAY_VERSION_CODE" >> "$GITHUB_ENV"
          echo "PLAY_RELEASE_NAME=Internal $PLAY_VERSION_CODE (${GITHUB_SHA::7})" >> "$GITHUB_ENV"

      - name: Build Tempus release bundle
        run: |
          ./gradlew bundleTempusRelease \
            -PplayApplicationId="$PLAY_PACKAGE_NAME" \
            -PversionCodeOverride="$PLAY_VERSION_CODE"

      - name: Sign Play bundle
        id: sign_play_bundle
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/bundle/tempusRelease
          signingKeyBase64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          alias: ${{ secrets.PLAY_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.PLAY_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PLAY_PACKAGE_NAME }}
          releaseFile: ${{ steps.sign_play_bundle.outputs.signedReleaseFile }}
          track: internal
          status: completed
          releaseName: ${{ env.PLAY_RELEASE_NAME }}

      - name: Upload signed bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: play-internal-aab
          path: ${{ steps.sign_play_bundle.outputs.signedReleaseFile }}
          retention-days: 14
